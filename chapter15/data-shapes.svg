<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Dataset tensor shapes</title><desc id="desc">A saved dataset splits into X, Y, and y tensors with concrete shapes.</desc>
  <rect width="960" height="360" fill="#f8fafc"/><text x="480" y="45" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0f172a">Dataset shapes</text>
  <rect x="55" y="125" width="205" height="110" rx="16" fill="#334155"/><text x="158" y="172" text-anchor="middle" font-family="monospace" font-size="22" fill="white">data</text><text x="158" y="204" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#cbd5e1">1000 samples</text>
  <path d="M270 180H340" stroke="#64748b" stroke-width="4"/><path d="m340 180-14-9v18z" fill="#64748b"/>
  <g font-family="sans-serif" text-anchor="middle"><rect x="365" y="80" width="170" height="80" rx="13" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><text x="450" y="115" font-size="23" font-weight="700" fill="#1e3a8a">X</text><text x="450" y="143" font-size="18" fill="#1e40af">[1000, 49]</text>
  <rect x="585" y="80" width="170" height="80" rx="13" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="670" y="115" font-size="23" font-weight="700" fill="#14532d">Y</text><text x="670" y="143" font-size="18" fill="#166534">[1000, 10]</text>
  <rect x="695" y="220" width="170" height="80" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="780" y="255" font-size="23" font-weight="700" fill="#78350f">y</text><text x="780" y="283" font-size="18" fill="#92400e">[1000]</text></g>
  <text x="450" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">7 × 7 → 49</text><text x="670" y="190" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">one-hot</text><text x="780" y="330" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#475569">labels 0…9</text>
</svg>
