<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Two softmax examples</title><desc id="desc">Scores one and two yield probabilities point two seven and point seven three; reversing scores reverses probabilities.</desc><rect width="960" height="420" fill="#f8fafc"/><text x="480" y="42" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="700" fill="#0f172a">softmax: scores → probabilities</text>
  <g font-family="sans-serif"><text x="250" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Example 1: [1, 2]</text><line x1="90" y1="340" x2="410" y2="340" stroke="#94a3b8" stroke-width="2"/><rect x="145" y="264" width="80" height="76" fill="#60a5fa"/><rect x="275" y="136" width="80" height="204" fill="#2563eb"/><text x="185" y="255" text-anchor="middle" font-size="19">0.27</text><text x="315" y="127" text-anchor="middle" font-size="19">0.73</text><text x="185" y="370" text-anchor="middle">class 0</text><text x="315" y="370" text-anchor="middle">class 1 ✓</text>
  <text x="710" y="80" text-anchor="middle" font-size="20" font-weight="700" fill="#334155">Example 2: [2, 1]</text><line x1="550" y1="340" x2="870" y2="340" stroke="#94a3b8" stroke-width="2"/><rect x="605" y="136" width="80" height="204" fill="#16a34a"/><rect x="735" y="264" width="80" height="76" fill="#86efac"/><text x="645" y="127" text-anchor="middle" font-size="19">0.73</text><text x="775" y="255" text-anchor="middle" font-size="19">0.27</text><text x="645" y="370" text-anchor="middle">class 0 ✓</text><text x="775" y="370" text-anchor="middle">class 1</text>
  <text x="480" y="405" text-anchor="middle" font-size="17" fill="#475569">P(class 0) + P(class 1) = 1.00</text></g>
</svg>
